name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Create Google Services JSON Files
      run: |
        mkdir -p app_pojavlauncher/src/main
        mkdir -p app_pojavlauncher/src/debug
        
        JSON_CONTENT='{"project_info":{"project_number":"0","project_id":"dummy","storage_bucket":"dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.cslaucher.plus"}},"api_key":[{"current_key":"dummy"}]}]}'
        
        echo "$JSON_CONTENT" > app_pojavlauncher/google-services.json
        echo "$JSON_CONTENT" > app_pojavlauncher/src/google-services.json
        echo "$JSON_CONTENT" > app_pojavlauncher/src/main/google-services.json
        echo "$JSON_CONTENT" > app_pojavlauncher/src/debug/google-services.json

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FrostyLauncher-APK
        path: '**/build/outputs/apk/debug/*.apk'
